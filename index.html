tElementById('count-display');\n    const motionToggle = document.getElementById('motion-toggle');\n    const speedInput = document.getElementById('balloon-speed');\n    const speedDisplay = document.getElementById('speed-display');\n    const voiceToggle = document.getElementById('voice-toggle');\n    const autoLevelCountToggle = document.getElementById('auto-level-count-toggle');\n    const autoLevelSpeedToggle = document.getElementById('auto-level-speed-toggle');\n    const bgColorInput = document.getElementById('bg-color');\n    const startBtn = document.getElementById('start-btn');\n    const backBtn = document.getElementById('back-to-settings');\n\n    const continueBtn = document.getElementById('continue-btn');\n    const stopBtn = document.getElementById('stop-btn');\n    const resetAppBtn = document.getElementById('reset-app-btn');\n    const playCounterText = document.getElementById('play-counter-text');\n    const finalStats = document.getElementById('final-stats');\n\n    let totalBalloons = 5;\n    let poppedCount = 0;\n    let playCount = 0; \n    const MAX_PLAYS = 5;\n    const colors = ['#FF5252', '#448AFF', '#4CAF50', '#FFEB3B', '#E040FB', '#FF9800', '#00BCD4', '#FF4081', '#7C4DFF', '#EEFF41'];\n\n    // Reflect settings\n    countInput.addEventListener('input', () => {\n        countDisplay.textContent = countInput.value;\n        totalBalloons = parseInt(countInput.value);\n    });\n    speedInput.addEventListener('input', () => {\n        speedDisplay.textContent = speedInput.value;\n    });\n\n    // Back to settings (hidden button top-left)\n    let backTimer;\n    const resetToHome = () => location.reload();\n    backBtn.addEventListener('mousedown', () => { backTimer = setTimeout(resetToHome, 2000); });\n    backBtn.addEventListener('touchstart', (e) => { e.preventDefault(); backTimer = setTimeout(resetToHome, 2000); });\n    backBtn.addEventListener('mouseup', () => { clearTimeout(backTimer); });\n    backBtn.addEventListener('touchend', () => { clearTimeout(backTimer); });\n\n    // Text to Speech\n    const speak = (text) => {\n        if (!voiceToggle.checked) return;\n        window.speechSynthesis.cancel();\n        const uttr = new SpeechSynthesisUtterance(text);\n        uttr.lang = 'ja-JP';\n        uttr.rate = 1.0;\n        window.speechSynthesis.speak(uttr);\n    };\n\n    // Sound effects\n    let audioCtx;\n    function playPopSound() {\n        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n        const osc = audioCtx.createOscillator();\n        const gain = audioCtx.createGain();\n        osc.type = 'sine';\n        osc.frequency.setValueAtTime(400, audioCtx.currentTime);\n        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.1);\n        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);\n        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);\n        osc.connect(gain);\n        gain.connect(audioCtx.destination);\n        osc.start();\n        osc.stop(audioCtx.currentTime + 0.1);\n    }\n\n    // Start learning session\n    startBtn.addEventListener('click', () => {\n        if (audioCtx) audioCtx.resume();\n        document.body.style.backgroundColor = bgColorInput.value;\n        settingsScreen.classList.add('hidden');\n        gameScreen.classList.remove('hidden');\n        playCount = 0;\n        setupGame();\n    });\n\n    // Choices\n    continueBtn.addEventListener('click', () => {\n        choiceScreen.classList.add('hidden');\n        applyLevelUps();\n        setupGame();\n    });\n\n    stopBtn.addEventListener('click', () => {\n        choiceScreen.classList.add('hidden');\n        showFinalEnding();\n    });\n\n    resetAppBtn.addEventListener('click', resetToHome);\n\n    function setupGame() {\n        balloonContainer.innerHTML = '';\n        guideDots.innerHTML = '';\n        poppedCount = 0;\n\n        // Visual guide dots\n        for (let i = 0; i \u003c totalBalloons; i++) {\n            const dot = document.createElement('div');\n            dot.className = 'w-6 h-6 rounded-full bg-gray-700 border border-gray-600 transition-all';\n            dot.id = `dot-${i}`;\n            guideDots.appendChild(dot);\n        }\n\n        // Create balloons\n        const existingPos = [];\n        const size = Math.min(window.innerWidth, window.innerHeight) * 0.22;\n        \n        for (let i = 0; i \u003c totalBalloons; i++) {\n            createBalloon(i, size, existingPos);\n        }\n    }\n\n    function createBalloon(index, size, existingPos) {\n        const balloon = document.createElement('div');\n        balloon.className = 'balloon';\n        \n        if (motionToggle.checked) {\n            balloon.classList.add('float-anim');\n            const speedLevel = parseInt(speedInput.value); \n            const baseDur = 6 - speedLevel;\n            balloon.style.animationDuration = `${baseDur * 0.7 + Math.random() * 1.5}s`;\n            const range = speedLevel * 40 + 30; \n            balloon.style.setProperty('--move-x1', `${(Math.random() - 0.5) * range}px`);\n            balloon.style.setProperty('--move-y1', `${(Math.random() - 0.5) * range}px`);\n            balloon.style.setProperty('--move-x2', `${(Math.random() - 0.5) * range}px`);\n            balloon.style.setProperty('--move-y2', `${(Math.random() - 0.5) * range}px`);\n            balloon.style.setProperty('--move-x3', `${(Math.random() - 0.5) * range}px`);\n            balloon.style.setProperty('--move-y3', `${(Math.random() - 0.5) * range}px`);\n        }\n        \n        let x, y, overlapping = true, attempts = 0;\n        const pad = 30;\n        while (overlapping && attempts \u003c 150) {\n            x = pad + Math.random() * (window.innerWidth - size - pad * 2);\n            y = pad + 80 + Math.random() * (window.innerHeight - size * 1.5 - pad - 80);\n            overlapping = false;\n            for (let pos of existingPos) {\n                const dist = Math.sqrt((x-pos.x)**2 + (y-pos.y)**2);\n                if (dist \u003c size * 0.9) { overlapping = true; break; }\n            }\n            attempts++;\n        }\n        existingPos.push({x, y});\n        \n        balloon.style.left = `${x}px`;\n        balloon.style.top = `${y}px`;\n        balloon.style.width = `${size}px`;\n        balloon.style.height = `${size * 1.2}px`;\n        \n        const color = colors[index % colors.length];\n        balloon.innerHTML = `\n            \u003csvg viewBox=\"0 0 100 120\" width=\"100%\" height=\"100%\">\n                \u003cdefs>\n                    \u003cradialGradient id=\"grad-${index}\" cx=\"40%\" cy=\"40%\" r=\"50%\" fx=\"30%\" fy=\"30%\">\n                        \u003cstop offset=\"0%\" style=\"stop-color:white;stop-opacity:0.4\" />\n                        \u003cstop offset=\"100%\" style=\"stop-color:${color};stop-opacity:1\" />\n                    \u003c/radialGradient>\n                \u003c/defs>\n                \u003cellipse cx=\"50\" cy=\"50\" rx=\"45\" ry=\"50\" fill=\"url(#grad-${index})\" />\n                \u003cpath d=\"M50 100 L43 110 L57 110 Z\" fill=\"${color}\" />\n                \u003cpath d=\"M50 110 Q55 115 50 120\" stroke=\"white\" stroke-width=\"2\" fill=\"none\" />\n            \u003c/svg>\n        `;\n\n        const pop = (e) => {\n            e.preventDefault();\n            const cx = e.clientX || (e.touches && e.touches[0].clientX);\n            const cy = e.clientY || (e.touches && e.touches[0].clientY);\n            if (balloon.dataset.popped) return;\n            balloon.dataset.popped = \"true\";\n            \n            poppedCount++;\n            playPopSound();\n            speak(poppedCount.toString());\n\n            const num = document.createElement('div');\n            num.className = 'pop-number';\n            num.textContent = poppedCount;\n            num.style.left = `${cx}px`;\n            num.style.top = `${cy}px`;\n            document.body.appendChild(num);\n            setTimeout(() => num.remove(), 1000);\n\n            const dot = document.getElementById(`dot-${poppedCount - 1}`);\n            if (dot) dot.classList.add('bg-yellow-400', 'border-white', 'ring-4', 'ring-yellow-200');\n\n            balloon.style.transform = 'scale(1.8)';\n            balloon.style.opacity = '0';\n            setTimeout(() => balloon.remove(), 250);\n\n            if (poppedCount === totalBalloons) setTimeout(showClearChoice, 800);\n        };\n\n        balloon.addEventListener('pointerdown', pop);\n        balloonContainer.appendChild(balloon);\n    }\n\n    function showClearChoice() {\n        playCount++;\n        if (playCount >= MAX_PLAYS) {\n            showFinalEnding();\n            return;\n        }\n\n        speak(\"できた！ つぎも やる？ それとも おしまい？\");\n        playCounterText.textContent = `（いま ${playCount}かいめ だよ）`;\n        choiceScreen.classList.remove('hidden');\n        fireConfetti(100);\n    }\n\n    function applyLevelUps() {\n        let text = \"もういっかい！\";\n        let countUp = false, speedUp = false;\n\n        if (autoLevelCountToggle.checked && totalBalloons \u003c 10) {\n            totalBalloons++;\n            countInput.value = totalBalloons;\n            countDisplay.textContent = totalBalloons;\n            countUp = true;\n        }\n        let spd = parseInt(speedInput.value);\n        if (autoLevelSpeedToggle.checked && motionToggle.checked && spd \u003c 5) {\n            spd++;\n            speedInput.value = spd;\n            speedDisplay.textContent = spd;\n            speedUp = true;\n        }\n\n        if (countUp && speedUp) text = `${totalBalloons}こ に なって、もっと はやく うごくよ！`;\n        else if (countUp) text = `${totalBalloons}こ に ちょうせん！`;\n        else if (speedUp) text = \"もっと はやく うごくよ！\";\n        \n        speak(text);\n    }\n\n    function showFinalEnding() {\n        gameScreen.classList.add('hidden');\n        finalScreen.classList.remove('hidden');\n        finalStats.textContent = `${playCount}かい クリア！ すごいね！`;\n        speak(`たいへん よく できました！ ${playCount}かい も できたね！ おしまい！`);\n        \n        // Endless confetti for final\n        const interval = setInterval(() => {\n            if (finalScreen.classList.contains('hidden')) clearInterval(interval);\n            fireConfetti(20);\n        }, 500);\n        fireConfetti(300);\n    }\n\n    function fireConfetti(amount) {\n        const confColors = ['#fce18a', '#ff726d', '#b48def', '#f4306d', '#42b983', '#00BCD4'];\n        for (let i = 0; i \u003c amount; i++) {\n            const c = document.createElement('div');\n            c.className = 'confetti';\n            c.style.backgroundColor = confColors[Math.floor(Math.random() * confColors.length)];\n            if (Math.random() > 0.5) c.style.borderRadius = '50%';\n            c.style.width = (Math.random() * 12 + 6) + 'px';\n            c.style.height = (Math.random() * 18 + 10) + 'px';\n            const tx = (Math.random() - 0.5) * window.innerWidth * 1.8;\n            const ty = - (Math.random() * window.innerHeight * 1.3 + 150);\n            c.style.setProperty('--tx', `${tx}px`);\n            c.style.setProperty('--ty', `${ty}px`);\n            c.style.setProperty('--rot', `${Math.random() * 1080}deg`);\n            c.style.animationDelay = `${Math.random() * 0.8}s`;\n            document.body.appendChild(c);\n            setTimeout(() => c.remove(), 3500);\n        }\n    }\n\u003c/script>\n\n\u003caudio id=\"__vb_behavior_media_912210329\" data-vb-behavior-media=\"audio/OtoNoHime_2026-10-04T11-25-19.mp3\" src=\"audio/OtoNoHime_2026-10-04T11-25-19.mp3\" style=\"display: none;\" preload=\"auto\">\u003c/audio>\u003cscript id=\"__vb_behavior_runtime\" data-vb-behavior-runtime=\"1\">(function(){\n  if(window.__vbBehaviorRuntimeInstalled)return;window.__vbBehaviorRuntimeInstalled=true;\n  function cfg(el){try{return JSON.parse(el.getAttribute('data-vb-behaviors')||'{}')}catch(e){return {}}}\n  function target(sel,origin){if(!sel||sel==='self')return ori
